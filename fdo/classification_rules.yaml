# ============================================================
# classification_rules.yaml
#
# Heuristic classification rules for FDO distributions
# Version: 0.1
# ============================================================

version: "0.1"

fdo_classes:
  fdo:SoftwareFDO:
    default_role: software
    rules:
      - match:
          extension: [".py", ".r", ".js", ".java"]
        role: script

      - match:
          filename: ["setup.py", "pyproject.toml", "requirements.txt"]
        role: configuration

      - match:
          extension: [".exe", ".jar", ".bin"]
        role: software

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".rst", ".txt"]
        role: documentation

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

      - match:
          path_prefix: ["tests/"]
        role: auxiliary

  fdo:AnalysisFDO:
    default_role: data
    rules:
      - match:
          extension: [".ipynb"]
        role: script

      - match:
          extension: [".py", ".r"]
        role: script

      - match:
          extension: [".csv", ".tsv", ".parquet", ".json"]
        role: data

      - match:
          path_prefix: ["results/"]
        role: result

      - match:
          extension: [".png", ".jpg", ".pdf"]
        role: result

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".txt"]
        role: documentation

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

  fdo:3DDataFDO:
    default_role: data
    rules:
      - match:
          extension:
            [
              ".obj",
              ".ply",
              ".stl",
              ".glb",
              ".gltf",
              ".nxs",
              ".nxz",
              ".xyz",
              ".pts",
              ".ptx",
              ".dae",
            ]
        role: model

      - match:
          extension:
            [
              ".jpg",
              ".jpeg",
              ".png",
              ".tif",
              ".tiff",
              ".pdf",
              ".csv",
              ".xml",
              ".json",
            ]
        role: documentation

      - match:
          extension: [".las", ".laz"]
        role: data

      - match:
          path_prefix: ["textures/"]
        role: auxiliary

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".txt"]
        role: documentation

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata
